server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /nginx-health { access_log off; default_type text/plain; return 200 "ok"; }

  # API (cookie auth): same origin as the SPA, so no CORS is needed.
  location /api/ {
    client_max_body_size 210m;         # keep >= backend TL_MAX_UPLOAD_MB
    proxy_request_buffering off;       # stream uploads
    proxy_read_timeout 300s;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location ~ ^/(healthz|readyz)$ {
    proxy_pass http://backend:8000;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Hashed assets: cache hard.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # SPA history fallback.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
