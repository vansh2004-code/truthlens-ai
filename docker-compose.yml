# One command: docker compose up --build   (requires a .env file; see .env.example)
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    TL_DATABASE_URL: postgresql+psycopg://truthlens:${POSTGRES_PASSWORD}@postgres:5432/truthlens
    TL_REDIS_URL: redis://redis:6379/0
  volumes:
    - tl_data:/app/data
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: truthlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: truthlens
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U truthlens"], interval: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10}
  backend:
    <<: *backend
    ports: ["8000:8000"]
  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "-B"]
    healthcheck: {test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"], interval: 60s, timeout: 20s, retries: 3}
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  pg_data:
  tl_data:
